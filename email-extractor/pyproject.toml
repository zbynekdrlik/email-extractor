[project]
name = "email-extractor"
version = "0.4.0"
description = "OCR email extractor — reads IMAP, extracts body + attachments, writes Postgres for n8n"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # long prompt/option strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
# backfill.py is a one-off operator script with no tests yet — everything the
# add-on runs in production is measured (#27).
omit = ["app/backfill.py"]
