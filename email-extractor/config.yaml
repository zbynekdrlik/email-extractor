name: Email OCR Extractor
version: "0.9.61"
slug: email_extractor
description: Reads an IMAP mailbox, OCR-extracts the body + all attachments, and writes Postgres for n8n. Bundles its own Postgres on /data (leave pg_dsn empty, set pg_password).
url: https://github.com/zbynekdrlik/email-extractor
arch:
  - amd64
init: false
image: ghcr.io/zbynekdrlik/email-extractor-{arch}
ports:
  "8099/tcp": 8099
  "5432/tcp": null
ports_description:
  "8099/tcp": Dashboard + file API for n8n (original attachments + raw .eml)
  "5432/tcp": Bundled Postgres (only used when pg_dsn is empty; add-ons reach it internally without host mapping)
options:
  imap_host: ""
  imap_port: 993
  imap_user: ""
  imap_pass: ""
  folders: "INBOX"
  poll_interval: 60
  pg_dsn: ""
  pg_password: ""
  public_base_url: ""
  dashboard_base_url: ""
  api_token: ""
  dash_password: ""
  secret_key: ""
  http_port: 8099
  data_dir: "/data/store"
  catalog_sheet_id: ""
  catalog_gid: ""
  customer_gid: ""
  catalog_refresh_minutes: 60
  ai_orders_engine: "n8n"
  orders_shadow: false
  orders_shadow_days: 3
  static_orders_engine: "n8n"
  static_orders_shadow: false
  static_orders_shadow_days: 3
  orders_spend_cap_eur: 30
  openai_api_key: ""
  orders_model: "gpt-5.4"
  orders_reasoning_effort: "high"
  odoo_url: ""
  odoo_api_key: ""
  odoo_db: "odoo"
  orders_channel_id: 0
  delivery_notes_channel_id: 0
  orion_host: ""
  orion_port: 22
  orion_user: ""
  orion_pass: ""
  import_confirm_interval_minutes: 5
  import_morning_check_hour: 10
  import_morning_check_skip_saturday: true
  import_morning_check_skip_sunday: true
  import_alert_reminder_hours: 4
  static_digest_batch_size: 30
  static_digest_idle_minutes: 60
  delivery_notes_engine: "n8n"
  delivery_notes_shadow: false
  delivery_notes_shadow_days: 3
  dl_catalog_gid: ""
schema:
  imap_host: str
  imap_port: int
  imap_user: str
  imap_pass: password
  folders: str
  poll_interval: int
  pg_dsn: str?
  pg_password: password?
  public_base_url: str
  dashboard_base_url: str?
  api_token: password?
  dash_password: password?
  secret_key: password?
  http_port: int
  data_dir: str
  catalog_sheet_id: str?
  catalog_gid: str?
  customer_gid: str?
  catalog_refresh_minutes: int?
  ai_orders_engine: list(n8n|python)?
  orders_shadow: bool?
  orders_shadow_days: int?
  static_orders_engine: list(n8n|python)?
  static_orders_shadow: bool?
  static_orders_shadow_days: int?
  orders_spend_cap_eur: float?
  openai_api_key: password?
  orders_model: str?
  orders_reasoning_effort: list(low|medium|high|xhigh)?
  odoo_url: str?
  odoo_api_key: password?
  odoo_db: str?
  orders_channel_id: int?
  delivery_notes_channel_id: int?
  orion_host: str?
  orion_port: int?
  orion_user: str?
  orion_pass: password?
  import_confirm_interval_minutes: int?
  import_morning_check_hour: int?
  import_morning_check_skip_saturday: bool?
  import_morning_check_skip_sunday: bool?
  import_alert_reminder_hours: int?
  static_digest_batch_size: int?
  static_digest_idle_minutes: int?
  delivery_notes_engine: list(n8n|python)?
  delivery_notes_shadow: bool?
  delivery_notes_shadow_days: int?
  dl_catalog_gid: str?
